# Licence notices for the Rust crates shipped in the app (cargo-about). The accepted list matches
# deny.toml, which is what actually enforces it.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
