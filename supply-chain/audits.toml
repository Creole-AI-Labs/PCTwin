[[audits.serde_json]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "1.0.151 -> 1.0.154"
notes = "Reviewed 15 Oct 2026. Read the whole src/ diff. Behaviour changes: the text '-0' is no longer parsed as the integer 0 but falls through to the float path (so an integer field given '-0' may now be refused); Number::as_f32 now returns None for a value that overflows f32 instead of infinity; with the preserve_order feature (not used by PCTwin) the map uses a RandomState hasher (foldhash with no-std) and the indexmap dependency is built without default features; error positions for invalid UTF-8 inside raw values and strings are now computed (memchr, already a dependency, no new unsafe). The lexical/math.rs hunks are formatting or renames. No new unsafe in the diff, build script unchanged, no network or file access."

[[audits.signal-hook]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "0.3.18 -> 0.4.5"
notes = "Reviewed 15 Oct 2026 for PCTwin's one use: signal_hook::flag::register for SIGIO in pctwin-lease (Linux). Read the full non-test diff. flag.rs is unchanged apart from a test import, so the flag handler (an atomic store in the signal handler) is the same. low_level/pipe.rs now takes OwnedFd instead of raw fds (not used by PCTwin), sets FD_CLOEXEC, and fixes a double close; low_level/signal_details.rs drops the 32-bit Android sigset fallback; build.rs only compiles extract.c when the optional extended-siginfo-raw feature is on and the target is not Windows. Dev dependency serial_test removed. No network or file access. Same dependency (signal-hook-registry)."

[[audits.tauri]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "2.12.1 -> 2.12.2"
notes = "Reviewed 15 Oct 2026. Read the full src/ diff and compared the injected scripts/bundle.global.js (minified: the menu helper was refactored, no new fetch, eval, WebSocket or URL; the only URL string, the mock-IPC localhost form, is unchanged). Changes: Listeners::once no longer panics if a replayed queued emit calls the handler twice; the Menu and Submenu wrappers now keep their own item list instead of re-asking muda; the macOS restart path (process.rs) first runs /usr/bin/open -n on the app bundle with the current arguments, then falls back to spawning the bundle's own executable with null stdio in a new process group. No new dependencies, no new unsafe, build script unchanged, no network access."

