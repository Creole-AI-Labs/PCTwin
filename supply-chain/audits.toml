[[audits.thread-priority]]
who = "PCTwin maintainers"
criteria = "safe-to-deploy"
version = "3.1.1"
notes = "Read in full for the code compiled on Windows and Linux, the two systems PCTwin uses it on (20 October 2026). Every unsafe block is a direct system call with arguments the crate owns: Windows SetThreadPriority, GetThreadPriority, GetCurrentThread, SetThreadPriorityBoost, SetThreadIdealProcessor; Linux pthread_setschedparam, pthread_getschedparam, setpriority, sched_get_priority_min/max, the sched_getattr/sched_setattr syscalls with a correctly sized struct, errno through libc's accessor, and a zero-initialised sched_param (plain integers). No pointer arithmetic, no memory outside its own locals, no network, no file access, no build script. Used only to put PCTwin's own sweep threads into background priority."

[[audits.zeroize]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "1.9.0 -> 1.9.1"
notes = "Reviewed 15 Oct 2026. Read the whole src/ diff. Changes: the extra optimization_barrier call after each volatile zeroing write was removed from the scalar, SIMD, Option, MaybeUninit, slice and raw-pointer impls (the volatile writes that do the zeroing remain); Vec<Z>::zeroize now clears the spare capacity before the elements instead of after, which avoids zeroing the initialised elements twice; Zeroizing's Debug no longer prints the secret (opaque 'Zeroizing { .. }'); the fallback black-box read uses MaybeUninit<u8> to avoid reading uninitialised memory. No new dependencies, no build script. Residual: the removal of the barrier cannot be proven safe from a diff alone; it matches the upstream changelog (RustCrypto/utils #1535)."

[[audits.zstd]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "0.13.3 -> 0.14.2"
notes = "Reviewed 15 Oct 2026 for PCTwin's use: zstd::bulk::compress/decompress and zstd::stream::read::Decoder in pctwin-transfer (default features off). Read the whole src/ diff. Safe Rust wrapper only, no unsafe added, no build script, no network or file access beyond the new compress_file helper (not used by PCTwin). Behaviour changes that touch the decompression-bomb limits: bulk::Decompressor::decompress now sums the frame sizes recorded in the headers and refuses up front if they exceed the caller's capacity, otherwise allocates at most that capacity (the cap PCTwin passes still bounds memory); stream::decode_all pre-reserves at most 32 MiB from a header-claimed size via try_reserve; the new Reader::read_to_end override only fills the Vec in 32 byte / one block steps, and PCTwin's capped read goes through io::Take, which does not call it. New try_* constructors replace panics on null contexts. Licence changed from MIT to BSD-3-Clause (allowed in deny.toml). Optional rust-allocator, cmake and vendored features are not enabled."

[[audits.zstd-safe]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "7.3.0 -> 8.1.0"
notes = "Reviewed 15 Oct 2026. Read the diff of src/lib.rs and the new src/rust_allocator.rs. The new with-rust-allocator feature (customAlloc/customFree backed by Rust's global allocator with a 16 byte size header, overflow-checked) is compiled only when the feature is on, and PCTwin does not enable it. Otherwise: a Poison field on CCtx/DCtx remembers a failed call until reset, try_create variants return None instead of panicking, and the unsafe FFI calls keep the same buffer and length arguments. No build script in this crate; no network or file access."

[[audits.zstd-sys]]
who = "PCTwin maintainers; to be confirmed in the security review"
criteria = "safe-to-deploy"
delta = "2.1.0+zstd.1.5.7 -> 2.1.1+zstd.1.5.7"
notes = "Reviewed 15 Oct 2026. The bundled zstd C tree (zstd/ directory, version 1.5.7) is byte-identical to the previous release (diff -r reports no differences), so no C code changed. Changes: build.rs gains an opt-in ZSTD_SYS_NO_HIDE_SYMBOLS environment switch (default unchanged: symbols stay hidden) and a bindgen callback adding Copy/Clone to opaque handle types, used only when the optional bindgen feature is on; the bundled bindings_*.rs files differ only in the generator version comment (0.71.1 to 0.73.2) and added doc comments. build.rs still only runs the cc compiler on the bundled sources: no network, no downloads, no file writes outside OUT_DIR."
