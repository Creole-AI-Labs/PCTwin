# cargo-deny policy for PCTwin: known vulnerabilities, licences, banned crates and allowed sources.
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisories (the same database cargo-audit uses) fail the build.
yanked = "deny"
# Accepted exceptions. Each has a reason and is reviewed by 6 January 2027 (see osv-scanner.toml).
ignore = [
  # (RUSTSEC-2024-0429, glib 0.18, is no longer reported by cargo-deny, so it is not ignored here;
  # OSV-Scanner still lists it by its GHSA id: see osv-scanner.toml.)
  # proc-macro-error is unmaintained (no known vulnerability). Build-time only, via the same
  # GTK 3 macros; it is not part of the shipped app.
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained build-time macro crate from Tauri GTK 3 stack" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences, plus MPL-2.0 (file-level copyleft, compatible with an open-source app).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
