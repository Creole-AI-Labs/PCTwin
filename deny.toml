# cargo-deny policy for PCTwin: known vulnerabilities, licences, banned crates and allowed sources.
# Run locally with: cargo deny check

[graph]
all-features = true
# Test-only crates (dev-dependencies) are left out of every check below, so a test helper that
# uses a raw file-system crate does not trip the bans. Shipped code is still checked in full.
exclude-dev = true

[advisories]
version = 2
# RustSec advisories (the same database cargo-audit uses) fail the build.
yanked = "deny"
# Accepted exceptions. Each has a reason and is reviewed by 6 January 2027 (see osv-scanner.toml).
ignore = [
  # (RUSTSEC-2024-0429, glib 0.18, is no longer reported by cargo-deny, so it is not ignored here;
  # OSV-Scanner still lists it by its GHSA id: see osv-scanner.toml.)
  # proc-macro-error is unmaintained (no known vulnerability). Build-time only, via the same
  # GTK 3 macros; it is not part of the shipped app.
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained build-time macro crate from Tauri GTK 3 stack" },
  # zvariant, zvariant_derive and zbus_names are unmaintained (no known vulnerability): merged
  # into zbus 6. They come with zbus 5 through keepawake and tauri-plugin-opener (Linux D-Bus),
  # which we cannot move to zbus 6 ourselves.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; zbus 5 comes via keepawake and tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; zbus 5 comes via keepawake and tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; zbus 5 comes via keepawake and tauri-plugin-opener" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences, plus MPL-2.0 (file-level copyleft, compatible with an open-source app).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

# The fuzz workspace (fuzz/, never shipped) is checked with this file too. libFuzzer's runtime
# carries LLVM's own permissive licence (NCSA) besides MIT or Apache-2.0; allowed for that crate only.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# The updater's HTTPS (app/src-tauri/src/updates.rs) checks certificates against the standard
# internet root certificates, which this crate carries as data under the Community Data License
# Agreement, a permissive licence (26 October 2026). Allowed for that crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Raw file-system power is allowed only through the safety gate (security design notes). `wrappers`
# lists the only crates that may depend on each one directly. No other pctwin crate is listed, so
# a new direct use in, say, pctwin-transfer fails `cargo deny check bans`.
deny = [
  { crate = "fs_at", wrappers = ["pctwin-gate"] },
  { crate = "cap-std", wrappers = ["pctwin-gate"] },
  # The hand-over walks a person's held files through folder handles that never follow a link,
  # and reads a file again only if it is still the file walked (fresh-context review of making
  # sign-ins, 24 October 2026).
  { crate = "cap-primitives", wrappers = ["cap-std", "pctwin-move"] },
  # Undo puts copies in the Trash itself, checked and by handle (21 October 2026), so no crate may.
  { crate = "trash" },
  # The first crate allowed to use unsafe (approved, October 2026; see scripts/unsafe-fence.sh).
  # Only the gate may use it, and only it may use signal-hook.
  { crate = "pctwin-lease", wrappers = ["pctwin-gate"] },
  { crate = "signal-hook", wrappers = ["pctwin-lease"] },
  # The second and last (approved 20 October 2026): the administrator helper's system calls.
  # Only the helper program may use it (21 October 2026), and the app, which starts the helper
  # through the system's own prompt and makes its private channel and token (since 22 October;
  # the unsafe code stays fenced inside pctwin-helper-os, covered by the helper's reviews).
  # Only it may use Service Management, and the autostart plugin's own wrapper on a Mac.
  { crate = "pctwin-helper-os", wrappers = ["pctwin-helper", "pctwin-app"] },
  { crate = "objc2-service-management", wrappers = ["pctwin-helper-os", "smappservice-rs"] },
  # macOS: making a new person's account (21 October 2026), only by the helper's system calls.
  { crate = "objc2-open-directory", wrappers = ["pctwin-helper-os"] },
  # macOS: the system's list of programs with a file open, asked only by the gate's undo; and
  # the path of the program on the other end of the helper's socket.
  { crate = "libproc", wrappers = ["pctwin-gate", "pctwin-helper-os"] },
  # macOS: a file's flags set by name (the hidden mark while a file is filled in), only by the
  # gate (16 October 2026); the helper's socket peer (LOCAL_PEERPID, LOCAL_PEERCRED, 20 October
  # 2026). Third-party crates that use nix themselves (checked 16 October 2026).
  { crate = "nix", wrappers = ["pctwin-gate", "pctwin-helper-os", "fs_at", "starship-battery", "os_info"] },
  { crate = "rustix", wrappers = [
    "pctwin-gate",
    # The helper's private folder and socket peer (SO_PEERCRED), 20 October 2026.
    "pctwin-helper-os",
    # The helper program opens another person's files without following a link (O_NOFOLLOW).
    "pctwin-helper",
    # The scan asks whether a file carries a download mark, by the attribute's presence only,
    # never its value (21 October 2026).
    "pctwin-scan",
    # The journal asks which file system its own folder is on (statfs), so it is never kept on
    # a network drive (26 October 2026).
    "pctwin-journal",
    # The app raises its own open-file limit on Mac and Linux (RLIMIT_NOFILE, limits.rs), so a
    # move with many connections never runs out of handles.
    "pctwin-app",
    # Third-party crates that use rustix themselves (checked 9 October 2026).
    "async-io", "async-process", "async-signal", "cap-primitives", "cap-std", "fs-set-times",
    "fs4", "polling", "rustix-linux-procfs", "tempfile", "zbus",
    # The Mac updater unpacks the new app with tar, which keeps file attributes through xattr
    # (checked 26 October 2026).
    "xattr",
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
