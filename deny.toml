# cargo-deny policy for PCTwin: known vulnerabilities, licences, banned crates and allowed sources.
# Run locally with: cargo deny check

[graph]
all-features = true
# Test-only crates (dev-dependencies) are left out of every check below, so a test helper that
# uses a raw file-system crate does not trip the bans. Shipped code is still checked in full.
exclude-dev = true

[advisories]
version = 2
# RustSec advisories (the same database cargo-audit uses) fail the build.
yanked = "deny"
# Accepted exceptions. Each has a reason and is reviewed by 6 January 2027 (see osv-scanner.toml).
ignore = [
  # (RUSTSEC-2024-0429, glib 0.18, is no longer reported by cargo-deny, so it is not ignored here;
  # OSV-Scanner still lists it by its GHSA id: see osv-scanner.toml.)
  # proc-macro-error is unmaintained (no known vulnerability). Build-time only, via the same
  # GTK 3 macros; it is not part of the shipped app.
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained build-time macro crate from Tauri GTK 3 stack" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences, plus MPL-2.0 (file-level copyleft, compatible with an open-source app).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Raw file-system power is allowed only through the safety gate (Security Design B). `wrappers`
# lists the only crates that may depend on each one directly. No other pctwin crate is listed, so
# a new direct use in, say, pctwin-transfer fails `cargo deny check bans`.
deny = [
  { crate = "fs_at", wrappers = ["pctwin-gate"] },
  { crate = "cap-std", wrappers = ["pctwin-gate"] },
  { crate = "cap-primitives", wrappers = ["cap-std"] },
  { crate = "trash", wrappers = ["pctwin-gate"] },
  # The one crate allowed to use unsafe (user-approved, October 2026; see scripts/unsafe-fence.sh).
  # It comes in on undo4. Only the gate may use it, and only it may use signal-hook.
  { crate = "pctwin-lease", wrappers = ["pctwin-gate"] },
  { crate = "signal-hook", wrappers = ["pctwin-lease"] },
  { crate = "rustix", wrappers = [
    "pctwin-gate",
    # until undo5-integ merges (it opens originals without following links; the gate will take that over)
    "pctwin-transfer",
    # Third-party crates that use rustix themselves (checked 9 October 2026).
    "async-io", "async-process", "async-signal", "cap-primitives", "cap-std", "fs-set-times",
    "fs4", "polling", "rustix-linux-procfs", "tempfile", "zbus",
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
