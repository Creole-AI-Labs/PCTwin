# Fuzz targets for everything that arrives from the other laptop or the person (Task List 1.3
# and 1.8). Run with cargo-fuzz on a nightly compiler, as CI does; kept out of the workspace so
# the shipped build never depends on it.
[package]
name = "pctwin-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pctwin-gate = { path = "../crates/pctwin-gate" }
pctwin-move = { path = "../crates/pctwin-move" }
pctwin-pairing = { path = "../crates/pctwin-pairing" }
pctwin-parse = { path = "../crates/pctwin-parse", features = ["test-support"] }
# The fuzz targets run the parser's readers in their own process, as the parser does.
pctwin-parse-seal = { path = "../crates/pctwin-parse-seal" }
pctwin-record = { path = "../crates/pctwin-record" }
pctwin-transfer = { path = "../crates/pctwin-transfer" }
pctwin-recipe = { path = "../crates/pctwin-recipe" }
pctwin-settings = { path = "../crates/pctwin-settings" }
pctwin-types = { path = "../crates/pctwin-types" }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory_frames"
path = "fuzz_targets/inventory_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory_v2"
path = "fuzz_targets/inventory_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_messages"
path = "fuzz_targets/pairing_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_digits"
path = "fuzz_targets/typed_digits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "landing_messages"
path = "fuzz_targets/landing_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_parsers"
path = "fuzz_targets/settings_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_wire"
path = "fuzz_targets/parser_wire.rs"
test = false
doc = false
bench = false
