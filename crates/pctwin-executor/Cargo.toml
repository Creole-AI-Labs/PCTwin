[package]
name = "pctwin-executor"
description = "Runs an approved plan of typed actions through an OS adapter; nothing outside the plan runs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The plan seal and the digest of each step a permission names.
blake3 = "1.8"
# Each step's permission: only the installs or settings recorder's key makes one.
pctwin-grant = { path = "../pctwin-grant" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-record = { path = "../pctwin-record" }
pctwin-recipe = { path = "../pctwin-recipe" }
pctwin-types = { path = "../pctwin-types" }
serde_json = "1"
thiserror = "2.0.21"
# 128 random bits for undo's private names.
getrandom = "0.4.3"

# Putting a settings file back only if unchanged (files.rs): MoveFileExW without replacing,
# wrapped safely, and a file's volume and number from its open handle.
[target.'cfg(windows)'.dependencies]
tempfile = "3"
winapi-util = "0.1.11"

# renameat2(RENAME_NOREPLACE) on Linux, renameatx_np(RENAME_EXCL) on macOS, and O_NOFOLLOW.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
redb = "4.3"
tempfile = "3"

[lints]
workspace = true
