[package]
name = "pctwin-readiness"
description = "Finishing a move: the evidence of what moved, can-I-work checks, focused repair, the before-wipe list, the handover gates, the recovery kit and the shareable report"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Digests that bind a decision to exactly what was shown (an identity, not a secret).
blake3 = "1.8"
# Kinds of file named as data (signed rows, checked offline): they only add to what is found.
pctwin-catalogue = { path = "../pctwin-catalogue" }
# Undo's durable close, read only: the gates take its proof of closing (ClosedToken).
pctwin-journal = { path = "../pctwin-journal" }
# The 2.6 plan: child jobs, their checked results and what did not finish.
pctwin-orchestrate = { path = "../pctwin-orchestrate" }
pctwin-record = { path = "../pctwin-record" }
# The six result words and their reasons.
pctwin-types = { path = "../pctwin-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Saving PCTwin's own records: a fresh temporary file moved into place, never over another.
tempfile = "3"
thiserror = "2.0.21"

[dev-dependencies]
# Tests keep journal keys beside their journals, never in the system's key store.
pctwin-journal = { path = "../pctwin-journal", features = ["test-keys"] }
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }
tempfile = "3"

[lints]
workspace = true
