# The readiness crate (Task List 2.7) gathers results, runs read-only checks and builds requests;
# it changes nobody's files and starts no program. Every way to make, write, rename or remove a file
# or folder is banned here by type, and so are starting a program and opening a network
# connection. The one exception is saving PCTwin's own records (the before-wipe list, the recovery
# kit) in store.rs, which writes through a fresh temporary file moved into place without
# replacing anything (tempfile), never through the calls banned below. Tests may use std::fs
# freely: lib.rs applies the ban only outside tests.
# allow-invalid: a path that is not built here is skipped quietly instead of warning.
disallowed-methods = [
    # std::fs: make, write, copy, move, remove, link, change rights
    { path = "std::fs::remove_file", reason = "remove only through pctwin_gate::Destination::remove_if_unchanged" },
    { path = "std::fs::remove_dir", reason = "remove only through the gate" },
    { path = "std::fs::remove_dir_all", reason = "remove only through the gate" },
    { path = "std::fs::rename", reason = "move only through the gate" },
    { path = "std::fs::write", reason = "write only through the gate" },
    { path = "std::fs::copy", reason = "copy only through the gate" },
    { path = "std::fs::create_dir", reason = "make folders only through the gate" },
    { path = "std::fs::create_dir_all", reason = "make folders only through the gate" },
    { path = "std::fs::hard_link", reason = "the gate never makes links" },
    { path = "std::fs::set_permissions", reason = "change rights only through the gate" },
    { path = "std::fs::File::create", reason = "write only through the gate" },
    { path = "std::fs::File::create_new", reason = "write only through the gate" },
    { path = "std::fs::File::set_len", reason = "resize only through the gate" },
    { path = "std::fs::File::set_permissions", reason = "change rights only through the gate" },
    { path = "std::fs::File::set_modified", reason = "set times only through the gate" },
    { path = "std::fs::File::set_times", reason = "set times only through the gate" },
    { path = "std::fs::OpenOptions::write", reason = "open for writing only through the gate" },
    { path = "std::fs::OpenOptions::append", reason = "open for writing only through the gate" },
    { path = "std::fs::OpenOptions::truncate", reason = "open for writing only through the gate" },
    { path = "std::fs::OpenOptions::create", reason = "open for writing only through the gate" },
    { path = "std::fs::OpenOptions::create_new", reason = "open for writing only through the gate" },
    { path = "std::os::unix::fs::symlink", reason = "the gate never makes links", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_file", reason = "the gate never makes links", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_dir", reason = "the gate never makes links", allow-invalid = true },
    # tokio::fs mirrors the same set
    { path = "tokio::fs::remove_file", reason = "remove only through the gate", allow-invalid = true },
    { path = "tokio::fs::remove_dir", reason = "remove only through the gate", allow-invalid = true },
    { path = "tokio::fs::remove_dir_all", reason = "remove only through the gate", allow-invalid = true },
    { path = "tokio::fs::rename", reason = "move only through the gate", allow-invalid = true },
    { path = "tokio::fs::write", reason = "write only through the gate", allow-invalid = true },
    { path = "tokio::fs::copy", reason = "copy only through the gate", allow-invalid = true },
    { path = "tokio::fs::create_dir", reason = "make folders only through the gate", allow-invalid = true },
    { path = "tokio::fs::create_dir_all", reason = "make folders only through the gate", allow-invalid = true },
    { path = "tokio::fs::hard_link", reason = "the gate never makes links", allow-invalid = true },
    { path = "tokio::fs::set_permissions", reason = "change rights only through the gate", allow-invalid = true },
    { path = "tokio::fs::File::create", reason = "write only through the gate", allow-invalid = true },
    { path = "tokio::fs::File::create_new", reason = "write only through the gate", allow-invalid = true },
    { path = "tokio::fs::File::set_len", reason = "resize only through the gate", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::write", reason = "open for writing only through the gate", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::append", reason = "open for writing only through the gate", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::truncate", reason = "open for writing only through the gate", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::create", reason = "open for writing only through the gate", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::create_new", reason = "open for writing only through the gate", allow-invalid = true },
    # cap-std and fs_at (the gate's own tools)
    { path = "cap_std::fs::Dir::remove_file", reason = "remove only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::remove_dir", reason = "remove only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::remove_dir_all", reason = "remove only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::rename", reason = "move only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::create", reason = "write only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::write", reason = "write only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::create_dir", reason = "make folders only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::create_dir_all", reason = "make folders only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::hard_link", reason = "the gate never makes links", allow-invalid = true },
    { path = "cap_std::fs::Dir::copy", reason = "copy only through the gate", allow-invalid = true },
    { path = "cap_std::fs::Dir::open_with", reason = "open for writing only through the gate", allow-invalid = true },
    { path = "fs_at::OpenOptions::unlink_at", reason = "remove only through the gate", allow-invalid = true },
    { path = "fs_at::OpenOptions::rmdir_at", reason = "remove only through the gate", allow-invalid = true },
    { path = "fs_at::OpenOptions::mkdir_at", reason = "make folders only through the gate", allow-invalid = true },
    { path = "fs_at::OpenOptions::symlink_at", reason = "the gate never makes links", allow-invalid = true },
    { path = "fs_at::OpenOptions::open_at", reason = "fs_at opens with full sharing; open only through the gate", allow-invalid = true },
    # rustix (raw system calls) on Unix
    { path = "rustix::fs::unlink", reason = "remove only through the gate", allow-invalid = true },
    { path = "rustix::fs::unlinkat", reason = "remove only through the gate", allow-invalid = true },
    { path = "rustix::fs::rmdir", reason = "remove only through the gate", allow-invalid = true },
    { path = "rustix::fs::rename", reason = "move only through the gate", allow-invalid = true },
    { path = "rustix::fs::renameat", reason = "move only through the gate", allow-invalid = true },
    { path = "rustix::fs::mkdir", reason = "make folders only through the gate", allow-invalid = true },
    { path = "rustix::fs::mkdirat", reason = "make folders only through the gate", allow-invalid = true },
    { path = "rustix::fs::symlink", reason = "the gate never makes links", allow-invalid = true },
    { path = "rustix::fs::symlinkat", reason = "the gate never makes links", allow-invalid = true },
    { path = "rustix::fs::link", reason = "the gate never makes links", allow-invalid = true },
    { path = "rustix::fs::linkat", reason = "the gate never makes links", allow-invalid = true },
    { path = "rustix::fs::chmod", reason = "change rights only through the gate", allow-invalid = true },
    { path = "rustix::fs::fchmod", reason = "change rights only through the gate", allow-invalid = true },
    { path = "rustix::fs::ftruncate", reason = "resize only through the gate", allow-invalid = true },
    # Never start a program, open a connection or send anything (T27-006, T27-030).
    { path = "std::process::Command::new", reason = "readiness checks never start a program" },
    { path = "std::net::TcpStream::connect", reason = "readiness never sends anything" },
    { path = "std::net::TcpStream::connect_timeout", reason = "readiness never sends anything" },
    { path = "std::net::UdpSocket::bind", reason = "readiness never sends anything" },
]
