[package]
name = "pctwin-orchestrate"
description = "More move types: cloud files, a smaller new laptop, several people and old laptops, dead-laptop rescue, and the plan that orders the work"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A child job's digest, so a result for another job is told apart (an identity, not a secret).
blake3 = "1.8"
# A rescued drive is read through folder handles, one name at a time, never through a link
# (third security review, finding 1): the crate under cap-std, as the hand-over uses it.
cap-primitives = "4.0.3"
# "Never follow a link" on an open, through its public extension (fourth review: not the
# doc-hidden method under it).
cap-fs-ext = { version = "4.0.3", default-features = false }
# Known places and names as data: they only add to what is found.
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-record = { path = "../pctwin-record" }
pctwin-scan = { path = "../pctwin-scan" }
# Local copies kept during the move itself are read through the send's own opener
# (src/local_copy_send.rs).
pctwin-transfer = { path = "../pctwin-transfer" }
# Which file a kept copy is, so undo on the new laptop can still tell its copy.
pctwin-journal = { path = "../pctwin-journal" }
# Every item ends one honest result; a plan only ever names the needs-action ones.
pctwin-types = { path = "../pctwin-types" }
serde = { version = "1", features = ["derive"] }
# The durable list of files made local on the old laptop (src/local_copy_send.rs).
serde_json = "1"
# Whether a rescued drive is mounted read-only, as the system reports it (vetted; safe calls).
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
thiserror = "2.0.21"
# Names from two old laptops are compared as the new laptop will hold them.
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# Which volume an open file is on and which file it is (its volume serial and file index), read
# from the handle with safe calls.
winapi-util = "0.1.11"

[dev-dependencies]
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }
proptest = "1.11.0"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
