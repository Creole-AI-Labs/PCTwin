[package]
name = "pctwin-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "PCTwin's administrator helper: started only for a move of several people, with a fixed list of typed commands, reading other people's files for the move read-only and never recalling online-only files."

[lints]
workspace = true

[features]
# Lets other crates' tests stage packages in any folder (HelperFolder::for_tests). Never in a
# release build: the crate refuses to compile with it there.
test-staging = []

[dependencies]
pctwin-types = { path = "../pctwin-types" }
# Privileged setting rows: their shape and loader (the rows in use are compiled in).
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-gate = { path = "../pctwin-gate" }
pctwin-grant = { path = "../pctwin-grant" }
pctwin-helper-os = { path = "../pctwin-helper-os" }
# The broker's intents and outcomes, kept durably in the helper's own journal (2.2 joined to 2.3).
pctwin-journal = { path = "../pctwin-journal" }
# The maker check of a package, made by the helper itself on its own copy before an elevated
# install (second review, findings B2 and B3).
pctwin-maker = { path = "../pctwin-maker" }
# The one implementation of the maker check's sealed HelperStaged.
pctwin-staged-seal = { path = "../pctwin-staged-seal" }
pctwin-record = { path = "../pctwin-record" }
pctwin-scan = { path = "../pctwin-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.3"
# A package the app sends to the helper's own folder crosses the channel in pieces, as text.
base64 = "0.22.1"
blake3 = "1.8"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"
# Windows Installer's own list of the packages it installed (2.1: after a crash, whether these
# exact bytes were installed).
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
# Tests keep journal keys beside their journals, never in the system's key store.
pctwin-journal = { path = "../pctwin-journal", features = ["test-keys"] }
# The helper's own integration tests stage packages in temporary folders.
pctwin-helper = { path = ".", features = ["test-staging"] }
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }
tempfile = "3"
zeroize = "1.9.0"
