[package]
name = "pctwin-maker"
description = "Checks that a downloaded or found installer comes from the same maker as the app on the old laptop: separate facts, never a score"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pctwin-types = { path = "../pctwin-types" }
authenticode = { version = "0.6.0", features = ["std"] }
base64 = "0.22.1"
cfb = "0.15"
cms = "0.2.3"
const-oid = "0.9"
der = { version = "0.7.10", features = ["alloc"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.21"
uuid = "1"
x509-cert = { version = "0.2.5", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows' own checks, asked of Windows itself (second review, finding B3): WinVerifyTrust and
# where Defender is, through the helper's fenced system calls; Defender's state through Windows'
# management service.
[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"

[target.'cfg(windows)'.dev-dependencies]
# The tests ask Windows itself through the real answers, as the helper does (the maker check never
# links the crate that makes the system calls; third security review, finding 8).
pctwin-helper-os = { path = "../pctwin-helper-os" }

[dev-dependencies]
authenticode = { version = "0.6.0", features = ["std", "object"] }
object = { version = "0.39", default-features = false, features = ["read_core", "pe", "std"] }
tempfile = "3"

[lints]
workspace = true
