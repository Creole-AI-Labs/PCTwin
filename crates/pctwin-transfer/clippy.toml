# Undo removes only the file it checked, through the handle it checked it on (Security Design B,
# decided 8 October 2026). This crate never removes a file by name: only the gate does, through
# Destination::remove_if_unchanged (or PCTwin's own temporary files, through the gate). A removal
# by name here is a lint error, so the whole flaw class cannot come back by accident.
disallowed-methods = [
    { path = "std::fs::remove_file", reason = "remove only through pctwin_gate::Destination::remove_if_unchanged" },
    { path = "std::fs::remove_dir_all", reason = "remove only through the gate" },
    { path = "cap_std::fs::Dir::remove_file", reason = "remove only through pctwin_gate::Destination::remove_if_unchanged" },
    { path = "cap_std::fs::Dir::remove_dir_all", reason = "remove only through the gate" },
    { path = "fs_at::OpenOptions::unlink_at", reason = "remove only through the gate" },
    { path = "fs_at::OpenOptions::open_at", reason = "fs_at opens with full sharing; remove only through the gate" },
]
