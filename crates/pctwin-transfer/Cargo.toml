[package]
name = "pctwin-transfer"
description = "Moving files in checked blocks: fingerprints, compression when it helps, receipts and resume"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
pctwin-gate = { path = "../pctwin-gate" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-link = { version = "0.1.0", path = "../pctwin-link" }
pctwin-record = { version = "0.1.0", path = "../pctwin-record" }
pctwin-scan = { version = "0.1.0", path = "../pctwin-scan" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
# Opening an original on the old laptop without following a link or waiting on a pipe.
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# An original's identity on the old laptop (volume number and file index), from its open handle.
winapi-util = "0.1.11"

[dev-dependencies]
pctwin-pairing = { path = "../pctwin-pairing" }
proptest = "1.11.0"
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
