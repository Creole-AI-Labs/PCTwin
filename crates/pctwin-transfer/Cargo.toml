[package]
name = "pctwin-transfer"
description = "Moving files in checked blocks: fingerprints, compression when it helps, receipts and resume"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
pctwin-gate = { path = "../pctwin-gate" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-link = { version = "0.1.0", path = "../pctwin-link" }
pctwin-record = { version = "0.1.0", path = "../pctwin-record" }
pctwin-scan = { version = "0.1.0", path = "../pctwin-scan" }
# The move meter's snapshot is what the screens read, as JSON.
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
# The gate's test faults (a byte stored wrong), to prove a move never names a file that reads back wrong.
pctwin-gate = { path = "../pctwin-gate", features = ["fault-plan"] }
pctwin-pairing = { path = "../pctwin-pairing" }
proptest = "1.11.0"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
