[package]
name = "pctwin-apps"
description = "Phase 2.1: finds every app on the old laptop with who made it, finds where to get each again, fetches it in a locked-down process, installs it through the administrator helper, and checks the result"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-grant = { path = "../pctwin-grant" }
# The broker's typed install action and its package channel (2.1 installs only through the helper).
pctwin-helper = { path = "../pctwin-helper" }
pctwin-maker = { path = "../pctwin-maker" }
pctwin-record = { path = "../pctwin-record" }
pctwin-types = { path = "../pctwin-types" }
plist = "1.10"
# Downloads, in the locked-down fetch process only (src/fetch): the same HTTP and TLS stack the
# app's updater already uses (rustls with ring, the system's own trust store).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.2", features = ["rt"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.21"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Whether the network is metered: Windows' own connection profile (safe WinRT calls).
windows = { version = "0.62.2", features = ["Networking_Connectivity"] }

[target.'cfg(windows)'.dev-dependencies]
pctwin-helper-os = { path = "../pctwin-helper-os" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util"] }
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }
tempfile = "3"

[lints]
workspace = true
