[package]
name = "pctwin-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4.0.3"
# Undo permits: nothing is removed once undo is closed for good.
pctwin-journal = { path = "../pctwin-journal" }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# Removes a file through the handle it was checked on (decided 8 October 2026; reviewed, pinned).
fs_at = "=0.2.1"
# MoveFileExW without replacing, wrapped safely, for drives without hard links.
tempfile = "3"
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
# 128 random bits from the system for undo's private names.
getrandom = "0.3"
# renameat2(RENAME_NOREPLACE) and renameatx_np(RENAME_EXCL), for drives without hard links.
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Whether another program has a file open (the one crate allowed unsafe code; decided 9 October 2026).
pctwin-lease = { path = "../pctwin-lease" }

[target.'cfg(target_os = "macos")'.dependencies]
# Apple's file coordination, so apps showing a file save and let go before undo removes it, and
# the list of programs with a file open (decided 9 October 2026). Safe bindings only.
block2 = "0.6"
libproc = "0.14"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSError", "NSFileCoordinator", "NSFilePresenter", "NSString", "NSURL"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"

[lints]
workspace = true
