[package]
name = "pctwin-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4.0.3"
# Undo permits: nothing is removed once undo is closed for good.
pctwin-journal = { path = "../pctwin-journal" }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# Removes a file through the handle it was checked on (decided 8 October 2026; reviewed, pinned).
fs_at = "=0.2.1"
# MoveFileExW without replacing, wrapped safely, for drives without hard links.
tempfile = "3"
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
# 128 random bits from the system for undo's private names.
getrandom = "0.3"
# renameat2(RENAME_NOREPLACE) and renameatx_np(RENAME_EXCL), for drives without hard links.
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Whether another program has a file open, through a Linux write lease (decided 9 October 2026).
pctwin-lease = { path = "../pctwin-lease" }

[target.'cfg(target_os = "macos")'.dependencies]
# The list of programs with a file open, for the reason a copy is kept (decided 9 October 2026;
# undo never removes on macOS since 13 October 2026). Safe bindings only.
libproc = "0.14"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"

[lints]
workspace = true
