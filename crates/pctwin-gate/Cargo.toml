[package]
name = "pctwin-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4.0.3"
# Undo permits: nothing is removed once undo is closed for good.
pctwin-journal = { path = "../pctwin-journal" }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# Removes a file through the handle it was checked on (decided 8 October 2026; reviewed, pinned).
fs_at = "=0.2.1"
# MoveFileExW without replacing, wrapped safely, for drives without hard links.
tempfile = "3"
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
# renameat2(RENAME_NOREPLACE) and renameatx_np(RENAME_EXCL), for drives without hard links.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"

[lints]
workspace = true
