[package]
name = "pctwin-catalogue"
description = "Signed, versioned catalogues of examples that only enrich what PCTwin finds on the laptop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A fixed, public test key that signs catalogues in other crates' tests. Never trusted by a
# production build: `TrustedKeys::production()` does not hold it.
test-key = ["dep:ring", "dep:blake2", "dep:base64"]

[dependencies]
# Minisign (Ed25519) signature checks, the scheme the Security Design names for signed builds;
# already in the workspace through the app's updater. No dependencies of its own.
minisign-verify = "0.3.0"
pctwin-types = { path = "../pctwin-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
# Test signing only (feature `test-key`).
ring = { version = "0.17.14", optional = true }
blake2 = { version = "0.10.6", optional = true }
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
ring = "0.17.14"
blake2 = "0.10.6"
base64 = "0.22.1"

[lints]
workspace = true
