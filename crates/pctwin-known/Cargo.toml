[package]
name = "pctwin-known"
description = "Quick Send's remembered connections: long-term keys in the system's key store, changing tokens, the three permissions and the folders they may use"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
pctwin-gate = { path = "../pctwin-gate" }
pctwin-pairing = { path = "../pctwin-pairing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.0"

# Where Documents, AppData, Program Files and the rest really are: the system's own known-folder
# lookup (the shell's known folders on Windows, the account's home elsewhere), never environment
# variables. Already in the tree under `dirs`.
dirs-sys = "0.5.0"

[target.'cfg(unix)'.dependencies]
# Opening a folder without following a link; the key folder checked to be the person's own.
rustix = { version = "1.1.5", features = ["fs", "process"] }

# Each connection's private key and pair secret, kept where the system keeps the person's secrets
# (Security Design Part T, Part G), as the journal's record key is.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }
# This laptop's hardware identity, to tell a restored or copied drive (already used by the journal).
wmi = "0.18.4"
# The known folders' ids (`FOLDERID_Documents` and the rest), for `dirs-sys`'s lookup.
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[dev-dependencies]
getrandom = "0.4.3"
tempfile = "3"

[lints]
workspace = true
