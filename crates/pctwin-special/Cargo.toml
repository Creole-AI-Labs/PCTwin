[package]
name = "pctwin-special"
description = "Phase 2.5 special categories: finds app data by general rules, tells what each file is by its content, decides per component who holds the key (portable, service-held, own export, machine-bound), captures live databases consistently and lands them through the safety gate with honest results"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pctwin-types = { path = "../pctwin-types" }
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-grant = { path = "../pctwin-grant" }
pctwin-gate = { path = "../pctwin-gate" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-recipe = { path = "../pctwin-recipe" }
# The app's own export tool is run only when the maker check finds it is the app's maker's.
pctwin-maker = { path = "../pctwin-maker" }
# The before-wipe checklist takes 2.5 steps.
pctwin-readiness = { path = "../pctwin-readiness" }
pctwin-record = { path = "../pctwin-record" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
blake3 = "1.8"
base64 = "0.22.1"
pctwin-settings = { path = "../pctwin-settings" }
# Other apps' SQLite databases: read and backed up through SQLite's own online backup, never
# copied raw while live. Bundled SQLite (3.54.1 with 0.41), past the WAL-reset race fixed in
# 3.51.3 (research notes, 27 October 2026). MIT; SQLite itself is public domain.
# `hooks`: a long scan is stopped by SQLite itself at its time limit.
# `serialize`: the parser process reads a database's copied bytes from memory, read-only.
rusqlite = { version = "0.41.0", features = ["bundled", "backup", "hooks", "serialize"] }
# Its readers of files' contents run only in the parser process (adoption change 1).
pctwin-parse-seal = { path = "../pctwin-parse-seal" }
tempfile = "3"
# Files named by their own SHA-256 (model libraries) are checked against it.
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
# Opening a file never follows a link or waits on a pipe (O_NOFOLLOW, O_NONBLOCK).
libc = "0.2"

[dev-dependencies]
# The maker check of an export tool reads it through the real parser process.
pctwin-parse = { path = "../pctwin-parse", features = ["test-support"] }
# Tests keep journal keys beside their journals, never in the system's key store.
pctwin-journal = { path = "../pctwin-journal", features = ["test-keys"] }
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }

[target.'cfg(windows)'.dev-dependencies]
# The tests make owner-only folders as the app does, and read their access lists back; the crate
# itself never links the helper library (it takes the owner-only folder as an interface).
pctwin-helper-os = { path = "../pctwin-helper-os" }

[lints]
workspace = true
