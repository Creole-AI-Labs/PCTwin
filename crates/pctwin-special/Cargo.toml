[package]
name = "pctwin-special"
description = "Phase 2.5 special categories: finds app data by general rules, tells what each file is by its content, decides per component who holds the key (portable, service-held, own export, machine-bound), captures live databases consistently and lands them through the safety gate with honest results"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pctwin-types = { path = "../pctwin-types" }
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-grant = { path = "../pctwin-grant" }
pctwin-record = { path = "../pctwin-record" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
blake3 = "1.8"
base64 = "0.22.1"
pctwin-settings = { path = "../pctwin-settings" }
# Other apps' SQLite databases: read and backed up through SQLite's own online backup, never
# copied raw while live. Bundled SQLite (3.54.1 with 0.41), past the WAL-reset race fixed in
# 3.51.3 (research notes, 27 October 2026). MIT; SQLite itself is public domain.
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
# Private snapshot folders for reading a live database's tables (already in the tree).
tempfile = "3"
# Files named by their own SHA-256 (model libraries) are checked against it.
sha2 = "0.10.9"

[dev-dependencies]
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }

[lints]
workspace = true
