[package]
name = "pctwin-scan"
description = "Scanning the old laptop: where each special folder really is, and what is in it"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cfb = "0.14"
dirs = "7.0.0"
lnk = "0.6.4"
pctwin-record = { path = "../pctwin-record" }
plist = "1.10"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
tempfile = "3"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
