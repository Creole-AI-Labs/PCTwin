[package]
name = "pctwin-scan"
description = "Scanning the old laptop: where each special folder really is, and what is in it"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
# Known names, places and routes as data: they only add to what is found.
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-types = { path = "../pctwin-types" }
cfb = "0.15"
dirs = "7.0.0"
lnk = "0.6.4"
pctwin-record = { path = "../pctwin-record" }
plist = "1.10"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
tempfile = "3"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
winreg = "0.55"
thread-priority = "3.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
thread-priority = "3.1.1"

# Whether a file carries a download mark, by the attribute's presence only (`marks.rs`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
pctwin-catalogue = { path = "../pctwin-catalogue", features = ["test-key"] }
proptest = "1.11.0"

[lints]
workspace = true
