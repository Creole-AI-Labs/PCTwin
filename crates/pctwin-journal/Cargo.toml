[package]
name = "pctwin-journal"
description = "The change journal: every write on the new laptop recorded step by step, so a crash is reconciled and a move can be undone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pctwin-record = { path = "../pctwin-record" }
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[dev-dependencies]
redb = "4.3"
tempfile = "3"

[lints]
workspace = true
