[package]
name = "pctwin-journal"
description = "The change journal: every write on the new laptop recorded step by step, so a crash is reconciled and a move can be undone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
# Each Phase 2 role's key: only the installs, settings or imports role's own key makes its recorder.
pctwin-grant = { path = "../pctwin-grant" }
getrandom = "0.4.3"
# Delivered catalogues' rollback marks are kept beside the journal's key (fourth review).
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-recipe = { path = "../pctwin-recipe" }
pctwin-record = { path = "../pctwin-record" }
pctwin-types = { path = "../pctwin-types" }
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
# The person's user number checks the Linux record key's file is theirs alone.
rustix = { version = "1.1.5", features = ["fs", "process"] }

# The key that seals each effect record, kept where the system keeps the person's secrets
# (security review finding 3): Windows' Credential Manager (DPAPI), macOS' login Keychain.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
# The bus of the disk the journal's folder is on (USB hard disks report themselves "fixed"), from
# the system's storage list (security review finding 4). Safe Rust; already used by the helper.
wmi = "0.18.4"
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[dev-dependencies]
redb = "4.3"
tempfile = "3"

[lints]
workspace = true
