[package]
name = "pctwin-move"
description = "One move from start to end, after pairing: the files to send, the new laptop's choices and approval, and every file's outcome, for the test lab and the app alike"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
# The hand-over walks the holding area and opens what it hands over through folder handles,
# never following a link out of it (the crate under cap-std, which the safety gate opens with).
cap-primitives = "4.0.3"
# "Never follow a link" on an open, through its public extension (fourth review: not the
# doc-hidden method under it).
cap-fs-ext = { version = "4.0.3", default-features = false }
pctwin-gate = { path = "../pctwin-gate" }
pctwin-helper = { path = "../pctwin-helper" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-link = { path = "../pctwin-link" }
pctwin-pairing = { path = "../pctwin-pairing" }
pctwin-record = { path = "../pctwin-record" }
# How carefully an old drive is read (a weak or rescued drive).
pctwin-scan = { path = "../pctwin-scan" }
pctwin-transfer = { path = "../pctwin-transfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# A rescued drive, end to end through a move.
pctwin-orchestrate = { path = "../pctwin-orchestrate" }
tempfile = "3"
tokio = { version = "1.53.2", features = ["test-util"] }

[lints]
workspace = true
