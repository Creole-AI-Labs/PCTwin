[package]
name = "pctwin-quicksend"
description = "Quick Send: chosen files and folders to a laptop nearby, over the move's sealed connection and safety gate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Waiting sends: each approved version's fingerprint.
blake3 = "1.8"
# Waiting sends sealed at rest: a fresh key per send, in the system's key store beside the
# connection keys (Security Design Part G), sealed with snow's ChaCha20-Poly1305 (Part A).
getrandom = "0.4.3"
pctwin-known = { path = "../pctwin-known" }
snow = "0.10.0"
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pctwin-gate = { path = "../pctwin-gate" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-move = { path = "../pctwin-move" }
pctwin-record = { path = "../pctwin-record" }
pctwin-scan = { path = "../pctwin-scan" }
pctwin-transfer = { path = "../pctwin-transfer" }
thiserror = "2.0.21"
# A note that is one web address is shown with the site it leads to.
url = "2.5.8"
tokio = { version = "1.53.2", features = ["macros", "time"] }

[dev-dependencies]
# Tests keep journal keys beside their journals, never in the system's key store.
pctwin-journal = { path = "../pctwin-journal", features = ["test-keys"] }
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
