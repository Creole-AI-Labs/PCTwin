[package]
name = "pctwin-fullmove"
description = "The full move: joins apps, settings and special categories to the move of files and people, with one plan, one approval, an honest result for every item and undo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The digest that binds the person's approval to exactly the extras and changes shown.
blake3 = "1.8"
# 2.1: where each app comes from, and the honest result after an install.
pctwin-apps = { path = "../pctwin-apps" }
# 2.3: settings applied through the approved plan, journaled, and undone with compare-and-write.
pctwin-executor = { path = "../pctwin-executor" }
pctwin-grant = { path = "../pctwin-grant" }
pctwin-journal = { path = "../pctwin-journal" }
pctwin-recipe = { path = "../pctwin-recipe" }
pctwin-record = { path = "../pctwin-record" }
# 2.4: settings found by discovery, sorted by kind, planned and applied.
pctwin-settings = { path = "../pctwin-settings" }
# 2.5: special categories found by general rules and classified by content (the published API).
pctwin-catalogue = { path = "../pctwin-catalogue" }
pctwin-special = { path = "../pctwin-special" }
# The app data stream's two ends (src/data.rs), and the gate the landing writes through.
pctwin-move = { path = "../pctwin-move" }
pctwin-gate = { path = "../pctwin-gate" }
pctwin-types = { path = "../pctwin-types" }
# The install chain (src/install.rs): the helper's broker actions, winget run as the person, and
# each download's SHA-256 (what the helper checks the bytes against).
pctwin-helper = { path = "../pctwin-helper" }
pctwin-maker = { path = "../pctwin-maker" }
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[dev-dependencies]
pctwin-transfer = { path = "../pctwin-transfer" }
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dev-dependencies]
# Removes the test lab's own registry key afterwards.
winreg = "0.55"

[lints]
workspace = true
