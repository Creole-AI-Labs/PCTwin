[package]
name = "pctwin-app"
version.workspace = true
description = "PCTwin desktop app"
authors = ["Creole AI Labs"]
license.workspace = true
publish.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pctwin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pctwin-discovery = { path = "../../crates/pctwin-discovery" }
pctwin-doctor = { path = "../../crates/pctwin-doctor" }
pctwin-journey = { path = "../../crates/pctwin-journey" }
pctwin-link = { path = "../../crates/pctwin-link" }
pctwin-session = { path = "../../crates/pctwin-session" }
tokio = { version = "1.53.2", features = ["sync"] }

[dev-dependencies]
pctwin-pairing = { path = "../../crates/pctwin-pairing" }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
