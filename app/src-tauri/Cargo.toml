[package]
name = "pctwin-app"
version.workspace = true
description = "PCTwin desktop app"
authors = ["Creole AI Labs"]
license.workspace = true
publish.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pctwin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's default features without `dynamic-acl`, which would let code grant the screens more while
# the app runs (src/lockdown.rs keeps it off; tests/permissions.rs checks what is granted).
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pctwin-discovery = { path = "../../crates/pctwin-discovery" }
pctwin-doctor = { path = "../../crates/pctwin-doctor" }
pctwin-gate = { path = "../../crates/pctwin-gate" }
pctwin-journal = { path = "../../crates/pctwin-journal" }
pctwin-journey = { path = "../../crates/pctwin-journey" }
pctwin-link = { path = "../../crates/pctwin-link" }
pctwin-move = { path = "../../crates/pctwin-move" }
pctwin-record = { path = "../../crates/pctwin-record" }
pctwin-scan = { path = "../../crates/pctwin-scan" }
pctwin-session = { path = "../../crates/pctwin-session" }
# `listed_enum!`: the views the screens are sent, declared with the list of their variants.
pctwin-transfer = { path = "../../crates/pctwin-transfer" }
pctwin-types = { path = "../../crates/pctwin-types" }
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }

[dev-dependencies]
pctwin-pairing = { path = "../../crates/pctwin-pairing" }
# The real permission check on a mock runtime (tests/permissions.rs). Tests only; no new crate.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "tray-icon", "test"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
