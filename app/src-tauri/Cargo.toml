[package]
name = "pctwin-app"
version.workspace = true
description = "PCTwin desktop app"
authors = ["Creole AI Labs"]
license.workspace = true
publish.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pctwin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's default features without `dynamic-acl`, which would let code grant the screens more while
# the app runs (src/lockdown.rs keeps it off; tests/permissions.rs checks what is granted).
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Updates (src/updates.rs): a newer build is checked against the update key in tauri.conf.json
# before it is installed. Driven from the engine only; the screens get no updater permission.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The laptop's own name, as its settings show it (src/laptop_name.rs), suggested as its PCTwin name.
whoami = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system's own window for a new account's temporary password (never the screens).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
zeroize = "1.9.0"
pctwin-discovery = { path = "../../crates/pctwin-discovery" }
pctwin-doctor = { path = "../../crates/pctwin-doctor" }
# Phase 2.1: the apps on the old laptop, with who made each.
pctwin-apps = { path = "../../crates/pctwin-apps" }
pctwin-maker = { path = "../../crates/pctwin-maker" }
# The parser process the maker check reads installers through (adoption change 1).
pctwin-parse = { path = "../../crates/pctwin-parse" }
pctwin-gate = { path = "../../crates/pctwin-gate" }
pctwin-helper = { path = "../../crates/pctwin-helper" }
pctwin-helper-os = { path = "../../crates/pctwin-helper-os" }
# Phase 2 roles (the broker's requests name the role that asks).
pctwin-grant = { path = "../../crates/pctwin-grant" }
# The broker request's one-use number.
getrandom = "0.4.3"
pctwin-journal = { path = "../../crates/pctwin-journal" }
# The full move: apps, settings and special categories joined to the move (src/fullmove.rs).
pctwin-fullmove = { path = "../../crates/pctwin-fullmove" }
pctwin-special = { path = "../../crates/pctwin-special" }
pctwin-settings = { path = "../../crates/pctwin-settings" }
pctwin-executor = { path = "../../crates/pctwin-executor" }
pctwin-recipe = { path = "../../crates/pctwin-recipe" }
blake3 = "1.8"
pctwin-journey = { path = "../../crates/pctwin-journey" }
pctwin-link = { path = "../../crates/pctwin-link" }
pctwin-move = { path = "../../crates/pctwin-move" }
# More move types (2.6): the screens show their plans, budgets and reports (src/guard_views.rs).
pctwin-orchestrate = { path = "../../crates/pctwin-orchestrate" }
pctwin-power = { path = "../../crates/pctwin-power" }
pctwin-quicksend = { path = "../../crates/pctwin-quicksend" }
pctwin-record = { path = "../../crates/pctwin-record" }
pctwin-scan = { path = "../../crates/pctwin-scan" }
pctwin-session = { path = "../../crates/pctwin-session" }
# `listed_enum!`: the views the screens are sent, declared with the list of their variants.
pctwin-transfer = { path = "../../crates/pctwin-transfer" }
pctwin-types = { path = "../../crates/pctwin-types" }
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }
# Opens PCTwin at sign-in while a move is under way, so a restart never loses it (src/restart.rs).
tauri-plugin-autostart = "2.7.0"

# Room for open files on macOS and Linux (src/limits.rs), through the system's own call, safely;
# and opening the receive folder without following a link (src/quicksend.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
# Tests keep journal keys beside their journals, never in the system's key store.
pctwin-journal = { path = "../../crates/pctwin-journal", features = ["test-keys"] }
pctwin-pairing = { path = "../../crates/pctwin-pairing" }
# The real permission check on a mock runtime (tests/permissions.rs). Tests only; no new crate.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "tray-icon", "test"] }
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
