version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      screens-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Keeps the SHA-pinned actions current; each update is a reviewed pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
