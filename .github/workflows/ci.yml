name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the whole matrix again on unchanged code, to catch flaky tests and runner or
  # toolchain changes before they meet a real change.
  schedule:
    - cron: "23 2 * * *"
  # The same full run on demand (after a fix to the nightly, say).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Screens (type check, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # A stuck runner (an apt mirror once hung for over an hour) is stopped instead of waiting
    # for GitHub's six-hour limit. The Intel Mac is the slowest runner: with a cold cache (the
    # first nightly run) it needed more than an hour, so it gets 90 minutes.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || 60 }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          # Audit only: these tests send to the local multicast group (device discovery), which a
          # blocking policy refuses. Every other Linux job blocks.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Bounded network waits and retries: a slow package mirror hung this step twice.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The app's Rust build embeds the built screens, so build them first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build screens
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # This checkout holds only the public repository, so every build here already proves the
      # core builds without the private one; this step also refuses any dependency that would
      # reach outside it (a path out of the checkout, or anything not from crates.io).
      - name: Public core stands alone
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/public-only.sh
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unsafe fence (only pctwin-lease may loosen unsafe_code)
        shell: bash
        run: bash scripts/unsafe-fence.sh
      - name: Unsafe fence self-test (it must catch attributes spread over lines)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/unsafe-fence-selftest.sh
      - name: Fence canary (clippy must reject a file removal in the canary crate)
        shell: bash
        run: bash scripts/clippy-canary.sh
      # The gate, journal and transfer tests all run here, on macOS too (the matrix includes
      # macos-latest and macos-15-intel): this runs the whole workspace.
      - name: Tests
        # Linux and macOS: the undo tests must really run on the runner's drive, never skip.
        env:
          PCTWIN_REQUIRE_UNIX_UNDO: "1"
        run: cargo test --workspace --locked --no-fail-fast
      # The desktop app, built and packaged on every system and kept unsigned for two weeks.
      # One package type per system keeps the build free of extra downloads.
      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS) bundles=app ;;
            Linux) bundles=deb ;;
          esac
          pnpm tauri build --ci --bundles "$bundles"
      # Phase 0 exit gate, "the blank app opens": the built app starts, its window loads the
      # screens, and it quits by itself (PCTWIN_SMOKE_TEST); a crash or a hang fails here.
      - name: The app opens
        shell: bash
        run: |
          for b in target/release/pctwin-app target/release/pctwin-app.exe target/release/PCTwin target/release/PCTwin.exe; do
            [ -x "$b" ] && app="$b" && break
          done
          echo "app: $app"
          marker="$RUNNER_TEMP/opened.txt"
          rm -f "$marker"
          export PCTWIN_SMOKE_TEST="$marker"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$app" & else "$app" & fi
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "the app did not quit within two minutes" >&2
            exit 1
          fi
          wait "$pid"
          cat "$marker"
          grep -q "titled PCTwin" "$marker"
      - name: Keep the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pctwin-unsigned-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      # macOS only: two probes that REPORT facts about the platform. They never fail the job.
      - name: macOS probe, file leases (F_SETLEASE)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/lease_probe" fixtures/macos/lease_probe.c
          "$RUNNER_TEMP/lease_probe" "$RUNNER_TEMP" || true
      - name: macOS probe, inode number reuse on APFS (2000 files)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/inode_reuse" fixtures/macos/inode_reuse.c
          "$RUNNER_TEMP/inode_reuse" "$RUNNER_TEMP" || true
          df -T "$RUNNER_TEMP" 2>/dev/null || mount | head -3

  # Task List 0.7: a whole move between two user accounts on one machine, through the real engine
  # (pairing, sealed link, safety gate, journal). Hosted runners cannot pair with each other, so
  # live pairing between machines is tested on owned hardware; this proves everything else.
  two-accounts:
    name: Test lab, move between two accounts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. Block on Linux; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the lab tools
        run: cargo build --locked -p pctwin-lab -p pctwin-labmove
      - name: Move between two accounts (Linux and macOS)
        if: runner.os != 'Windows'
        # /tmp, not the runner's temp folder: that sits in the runner's home, which the two test
        # accounts cannot enter.
        run: bash fixtures/two-accounts/run.sh "$PWD/target/debug" /tmp/pctwin-two-accounts
      - name: Move between two accounts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fixtures/two-accounts/run.ps1 -Bin "$PWD\target\debug" -Work 'C:\pctwin-two-accounts'
      # The evidence sits outside the workspace (the test accounts cannot enter the runner's
      # folders), so it is copied in before it is kept.
      - name: Gather the evidence
        if: always()
        shell: bash
        run: |
          mkdir -p lab-evidence
          for base in /tmp/pctwin-two-accounts /c/pctwin-two-accounts; do
          for d in "$base/report" "$base/profile/report" "$base/bad/report"; do
            if [ -d "$d" ]; then
              name=$(echo "$d" | sed 's#.*/pctwin-two-accounts/##; s#/#-#g')
              cp -r "$d" "lab-evidence/$name" 2>/dev/null || sudo cp -r "$d" "lab-evidence/$name" || true
            fi
          done
          done
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: two-accounts-${{ matrix.os }}
          path: lab-evidence
          if-no-files-found: warn
          retention-days: 14

  # Task List 0.7: cross-system handoff. One job scans a synthetic laptop and saves a lab package
  # (its record and each file under its item ID); a job on another system moves that package
  # through the real engine, so names born on one system meet the other system's safety gate.
  # The lab package is not encrypted: the encrypted drive package is Release 2's archive format.
  lab-pack:
    name: Test lab, pack on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. Block on Linux; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Make a lab laptop and pack it
        shell: bash
        run: |
          cargo build --locked -p pctwin-lab -p pctwin-labmove
          ./target/debug/pctwin-lab make "$RUNNER_TEMP/laptop" 41 60 1048576 > "$RUNNER_TEMP/made.json"
          ./target/debug/pctwin-labmove pack "$RUNNER_TEMP/laptop" lab-person lab-package
          cp "$RUNNER_TEMP/made.json" lab-package/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-package-${{ matrix.os }}
          path: lab-package
          if-no-files-found: error
          retention-days: 3

  lab-handoff:
    name: Test lab, move a package from ${{ matrix.from }} on ${{ matrix.to }}
    needs: lab-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: windows-latest, to: macos-latest }
          - { from: macos-latest, to: windows-latest }
          - { from: windows-latest, to: ubuntu-latest }
          - { from: ubuntu-latest, to: windows-latest }
    runs-on: ${{ matrix.to }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. Block on Linux; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-package-${{ matrix.from }}
          path: lab-package
      - name: Move the package through the engine and check it
        shell: bash
        run: |
          cargo build --locked -p pctwin-lab -p pctwin-labmove
          bin=./target/debug
          echo "package made on: $(cat lab-package/origin.txt)"
          mkdir -p handoff evidence
          "$bin/pctwin-labmove" receive handoff evidence/received.json "$RUNNER_TEMP/journal.redb" \
            --lab "$RUNNER_TEMP/new" lab-person-new &
          receiver=$!
          "$bin/pctwin-labmove" send handoff evidence/sent.json --package lab-package
          wait "$receiver"
          "$bin/pctwin-lab" snapshot "$RUNNER_TEMP/new" evidence/dest.json
          "$bin/pctwin-labmove" check lab-package/before.json lab-package/before.json \
            evidence/dest.json evidence/sent.json evidence/received.json | tee evidence/check.txt
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-handoff-${{ matrix.from }}-to-${{ matrix.to }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
