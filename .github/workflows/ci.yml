name: CI

# What runs when (decided 26 October 2026): a pull request gets the quick checks for the parts it
# touches; the merge queue checks the exact merge commit with the heavy set; pushes to main, the
# nightly run and the full-check label run everything. The `changes` job decides
# (scripts/ci-changes.sh), and "All checks" is the one check main requires.
on:
  push:
    branches: [main]
  pull_request:
    # Labelled too, so adding full-check starts the full set.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # Nightly: the whole matrix again on unchanged code, to catch flaky tests and runner or
  # toolchain changes before they meet a real change.
  schedule:
    - cron: "23 2 * * *"
  # The same full run on demand (after a fix to the nightly, say).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The network guard (Harden-Runner) only watches in this workflow's jobs, which read and hold
  # no secrets: its agent drops allowed sites' other addresses on some runners, failing
  # checkouts at random (step-security/harden-runner#708; decided 25 October 2026). Set back to
  # block when that issue is closed. Jobs that sign, publish or write keep block.
  EGRESS_POLICY: audit
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.decide.outputs.heavy }}
      ui: ${{ steps.decide.outputs.ui }}
      motion: ${{ steps.decide.outputs.motion }}
      rust_quick: ${{ steps.decide.outputs.rust_quick }}
      rust_os: ${{ steps.decide.outputs.rust_os }}
      fuzz: ${{ steps.decide.outputs.fuzz }}
      real_drives: ${{ steps.decide.outputs.real_drives }}
      labs: ${{ steps.decide.outputs.labs }}
      security: ${{ steps.decide.outputs.security }}
      codeql: ${{ steps.decide.outputs.codeql }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-changes.sh
          sparse-checkout-cone-mode: false
      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-check') }}
        run: |
          # The changed paths: a pull request's own list, or what the merge commit adds to main.
          # A list cut short (3000 files for a pull request, 300 for a comparison) runs everything.
          case "$EVENT" in
            pull_request)
              gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > changed.txt
              most=3000 ;;
            merge_group)
              gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename' > changed.txt
              most=300 ;;
            *) : > changed.txt; most=3000 ;;
          esac
          echo "changed: $(wc -l < changed.txt) paths"
          MOST_FILES=$most bash scripts/ci-changes.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  ui:
    # Also on Windows: the screen tests once failed there alone (16 October 2026), while Linux passed.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    name: ${{ matrix.os == 'ubuntu-latest' && 'Screens (type check, lint, unit tests, build)' || format('Screens (type check, lint, unit tests, build) ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || { sleep 15; pnpm install --frozen-lockfile; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  motion:
    # Motion smoothness in the engines the app really uses (Task List 1.10): Edge on Windows
    # (WebView2 is Edge's engine), the processor slowed four times as on a slow laptop, and WebKit
    # on a Mac (WKWebView's engine). Every frame of the opening and a screen change is timed.
    needs: changes
    if: needs.changes.outputs.motion == 'true'
    name: Motion smoothness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: msedge
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || { sleep 15; pnpm install --frozen-lockfile; }
      - run: pnpm build
      - name: The Mac's engine
        if: matrix.engine == 'webkit'
        run: pnpm exec playwright install webkit
      - name: Every frame timed
        run: node perf/motion-frames.mjs --engine ${{ matrix.engine }} --out motion-frames.json
      - name: Keep the figures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: motion-frames-${{ matrix.os }}
          path: app/motion-frames.json
          if-no-files-found: warn
          retention-days: 14

  fuzz:
    # Everything that arrives from the other laptop or the person, fuzzed for a minute per
    # target with cargo-fuzz (libFuzzer, nightly compiler): a crash, hang or failed check fails CI.
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    name: Fuzzing (messages, frames, the record, paths, pairing input, landing messages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: nightly
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked || { sleep 15; cargo +nightly install cargo-fuzz --locked; }
      - name: Fuzz each target for a minute
        shell: bash
        run: |
          for t in messages inventory_frames inventory_v2 record paths pairing_messages typed_digits landing_messages settings_parsers parsers parser_wire mail_kinds; do
            echo "== $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done

  real-drives:
    # The gate on real FAT-family drives, the ones with no hard links where names that differ only
    # in letter case are one name. Every system makes its own drives and the test runs twice, with
    # every drive unmounted and mounted again at the same path in between (PCTWIN_FAT_PHASE
    # before, then after). Drive kinds: Linux vfat, kernel exFAT and exfat-fuse; Mac FAT32 and
    # exFAT; Windows FAT32 and exFAT. Only the gate crate is built: no screens, no app.
    needs: changes
    if: needs.changes.outputs.real_drives == 'true'
    name: Gate on real drives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # See the rust job: on Windows the network guard's start-up step leaves the runner without
      # DNS for a few seconds.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Make the drives (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: bash scripts/real-drives-linux.sh setup
      - name: Make the drives (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        run: bash scripts/real-drives-mac.sh setup
      - name: Make the drives (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/real-drives-windows.ps1 setup
      # Build first, with no time limit of its own beyond the job's: the slower Mac runners take
      # about 10 minutes to compile, and the 10-minute limit below is meant to catch a hung test.
      - name: Build the real-drive tests
        shell: bash
        run: |
          cargo test -p pctwin-gate --test real_fat --locked --no-run
          cargo test -p pctwin-move --test sequence --locked --no-run
          cargo test -p pctwin-move --test full_drive --locked --no-run
      # Problems found before the move: every predicted name is the name the file lands under, on
      # each real drive (the runners' own NTFS, APFS and ext4 drives are the Rust job's run).
      - name: Predicted names on real drives
        timeout-minutes: 10
        shell: bash
        env:
          PCTWIN_REQUIRE_FAT: "1"
        run: cargo test -p pctwin-move --test sequence --locked on_real_drives -- --nocapture
      # A move into a drive that fills up part way (Task List 1.8): a small size-limited tmpfs,
      # nearly full. What landed is whole and finished, what did not fit ends "no space", nothing
      # partly written is left, and once space is freed the rest moves with nothing sent twice.
      - name: A move into a drive that fills up (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          small="$RUNNER_TEMP/small-drive"
          mkdir -p "$small"
          sudo mount -t tmpfs -o size=8m,mode=1777 tmpfs "$small"
          PCTWIN_SMALL_DRIVE="$small" cargo test -p pctwin-move --test full_drive --locked -- --nocapture
          sudo umount "$small"
      - name: Gate on real drives (before the remount)
        timeout-minutes: 10
        shell: bash
        env:
          PCTWIN_REQUIRE_FAT: "1"
          PCTWIN_FAT_PHASE: before
        run: cargo test -p pctwin-gate --test real_fat --locked --no-fail-fast -- --nocapture
      # A copy killed part way through on each drive; after the remount, recovery: nothing partly
      # copied under a real name, an honest record, nothing lost.
      - name: Recovery on real drives (before the remount, a copy killed part way)
        if: "!cancelled()"
        timeout-minutes: 15
        shell: bash
        env:
          PCTWIN_REQUIRE_FAT: "1"
          PCTWIN_FAT_PHASE: before
        run: cargo test -p pctwin-transfer --test real_fat_kill --locked -- --nocapture
      # Run even when the first run failed: the remount and the second run are still worth seeing.
      - name: Unmount and mount every drive again (Linux)
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 5
        shell: bash
        run: bash scripts/real-drives-linux.sh remount
      - name: Unmount and mount every drive again (Mac)
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 5
        shell: bash
        run: bash scripts/real-drives-mac.sh remount
      - name: Unmount and mount every drive again (Windows)
        if: runner.os == 'Windows' && !cancelled()
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/real-drives-windows.ps1 remount
      - name: Gate on real drives (after the remount)
        if: "!cancelled()"
        timeout-minutes: 10
        shell: bash
        env:
          PCTWIN_REQUIRE_FAT: "1"
          PCTWIN_FAT_PHASE: after
        run: cargo test -p pctwin-gate --test real_fat --locked --no-fail-fast -- --nocapture
      # A copy killed part way through on each drive; after the remount, recovery: nothing partly
      # copied under a real name, an honest record, nothing lost.
      - name: Recovery on real drives (after the remount)
        if: "!cancelled()"
        timeout-minutes: 15
        shell: bash
        env:
          PCTWIN_REQUIRE_FAT: "1"
          PCTWIN_FAT_PHASE: after
        run: cargo test -p pctwin-transfer --test real_fat_kill --locked -- --nocapture

  # The quick Rust checks on a pull request (Linux only; the six systems run in the merge
  # queue): formatting, the fences, lint, every test and the bridge examples. No app build.
  rust-quick:
    needs: changes
    if: needs.changes.outputs.rust_quick == 'true'
    name: Rust quick (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Audit only: these tests send to the local multicast group (device discovery), which a
          # blocking policy refuses.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Its own cache: the full Linux job's holds a release build this one never needs.
          key: quick
      # The app's Rust build embeds the built screens, so build them first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build screens
        working-directory: app
        run: |
          pnpm install --frozen-lockfile || { sleep 15; pnpm install --frozen-lockfile; }
          pnpm build
      - name: Formatting
        run: cargo fmt --all --check
      - name: Public core stands alone
        run: bash scripts/public-only.sh
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unsafe fence
        run: bash scripts/unsafe-fence.sh
      - name: Unsafe fence self-test
        run: bash scripts/unsafe-fence-selftest.sh
      - name: Fence canary
        run: bash scripts/clippy-canary.sh
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.148
      - name: Tests
        env:
          PCTWIN_REQUIRE_UNIX_UNDO: "1"
        run: cargo nextest run --workspace --locked --profile ci
      - name: Examples in the documentation
        run: cargo test --workspace --locked --doc
      - name: Bridge example files are current
        env:
          PCTWIN_WRITE_CONTRACT: "1"
        run: |
          cargo test -p pctwin-app --locked --lib contract::the_example_files_match_the_engine
          git diff --exit-code -- app/src/contract
          if [ -n "$(git status --porcelain -- app/src/contract)" ]; then
            git status --porcelain -- app/src/contract
            echo "app/src/contract has files that are not checked in" >&2
            exit 1
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust_os != '[]'
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All six in the heavy set; the three main ones when only the screens changed; Windows
        # alone on a pull request that changes what the installer is made from.
        os: ${{ fromJSON(needs.changes.outputs.rust_os) }}
    runs-on: ${{ matrix.os }}
    # A stuck runner (an apt mirror once hung for over an hour) is stopped instead of waiting
    # for GitHub's six-hour limit. The Intel Mac is the slowest runner: with a cold cache (the
    # first nightly run) it needed more than an hour, so it gets 90 minutes.
    # Windows also builds the release installer and installs it for real; the Intel Mac is slow.
    timeout-minutes: ${{ (matrix.os == 'macos-15-intel' || matrix.os == 'windows-latest') && 90 || 60 }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          # Audit only: these tests send to the local multicast group (device discovery), which a
          # blocking policy refuses. Every other Linux job blocks.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # Bounded network waits and retries: a slow package mirror hung this step twice.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The app's Rust build embeds the built screens, so build them first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build screens
        working-directory: app
        run: |
          pnpm install --frozen-lockfile || { sleep 15; pnpm install --frozen-lockfile; }
          pnpm build
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # This checkout holds only the public repository, so every build here already proves the
      # core builds without the private one; this step also refuses any dependency that would
      # reach outside it (a path out of the checkout, or anything not from crates.io).
      - name: Public core stands alone
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/public-only.sh
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unsafe fence (only the listed functions in pctwin-lease and pctwin-helper-os)
        shell: bash
        run: bash scripts/unsafe-fence.sh
      - name: Unsafe fence self-test (it must catch attributes spread over lines)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/unsafe-fence-selftest.sh
      - name: Fence canary (clippy must reject a file removal in the canary crate)
        shell: bash
        run: bash scripts/clippy-canary.sh
      # The gate, journal and transfer tests all run here, on macOS too (the matrix includes
      # macos-latest and macos-15-intel): this runs the whole workspace. cargo-nextest runs each
      # test in its own process and tries a failed test once more: a test that then passes is
      # still named FLAKY in the summary (.config/nextest.toml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.148
      - name: Tests
        # Linux and macOS: the undo tests must really run on the runner's drive, never skip.
        env:
          PCTWIN_REQUIRE_UNIX_UNDO: "1"
        run: cargo nextest run --workspace --locked --profile ci
      - name: Examples in the documentation
        run: cargo test --workspace --locked --doc
      # The screens' example files (app/src/contract) are the engine's own output. Made again
      # here, they must equal what is checked in, so a shape that crosses the bridge cannot change
      # without the screens' contract test (contract.test.ts) seeing the new shape.
      - name: Bridge example files are current
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PCTWIN_WRITE_CONTRACT: "1"
        run: |
          cargo test -p pctwin-app --locked --lib contract::the_example_files_match_the_engine
          git diff --exit-code -- app/src/contract
          if [ -n "$(git status --porcelain -- app/src/contract)" ]; then
            git status --porcelain -- app/src/contract
            echo "app/src/contract has files that are not checked in" >&2
            exit 1
          fi
      # The scan inventory's memory limit, measured on each system: hostile lists sent in pages
      # must be refused before the new laptop's process passes MAX_HELD plus a fixed allowance
      # (peak commit on Windows, largest resident size on macOS and Linux).
      - name: Inventory memory limit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" scripts/inventory-memory.py
      # The desktop app, built and packaged on every system and kept unsigned for two weeks.
      # One package type per system keeps the build free of extra downloads.
      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis; os=windows ;;
            macOS) bundles=app; os=macos ;;
            Linux) bundles=deb; os=linux ;;
          esac
          pnpm tauri build --ci --bundles "$bundles" --config "src-tauri/bundle/$os.json"
      # The installer carries the helper programs, where the app and the system look for them
      # (found 23 October 2026: it carried only the app, so moving other people could not work).
      - name: The installer carries the helpers
        shell: bash
        run: |
          bundle=target/release/bundle
          case "$RUNNER_OS" in
            Windows)
              # Tauri puts external binaries beside the app; the installer takes them from there.
              ls target/release/pctwin-helper.exe target/release/pctwin-handover.exe target/release/pctwin-parser.exe ;;
            macOS)
              app="$(ls -d "$bundle"/macos/*.app)"
              ls "$app/Contents/MacOS/pctwin-helper" "$app/Contents/MacOS/pctwin-handover" "$app/Contents/MacOS/pctwin-parser" "$app/Contents/MacOS/pctwin-fetch"
              plutil -lint "$app/Contents/Library/LaunchDaemons/com.creoleailabs.pctwin.helper.plist" ;;
            Linux)
              list="$(dpkg -c "$bundle"/deb/*.deb)"
              # dpkg lists paths with or without a leading "./".
              for f in usr/lib/pctwin/pctwin-helper usr/lib/pctwin/pctwin-handover usr/lib/pctwin/pctwin-parser \
                usr/share/polkit-1/actions/com.creoleailabs.pctwin.helper.policy; do
                echo "$list" | grep -E " (\./)?$f\$" || { echo "missing: $f" >&2; echo "$list" >&2; exit 1; }
              done ;;
          esac
      # Windows: the installer, run for real. A silent install puts the app and both helpers in
      # Program Files and adds no firewall rule (only a person's yes adds it); the hook's own
      # rule command, run here, makes a rule for PCTwin's program only, inbound TCP, private
      # networks only; uninstalling takes the rule and the files away.
      - name: The installer installs, asks before any firewall rule, and uninstalls clean
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rule = 'PCTwin (private networks)'
          function Rule-Count { @(Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue).Count }
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer ended with $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'PCTwin'
          $app = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch '^(pctwin-helper|pctwin-handover|pctwin-parser|uninstall)' } | Select-Object -First 1
          foreach ($f in 'pctwin-helper.exe', 'pctwin-handover.exe', 'pctwin-parser.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "not installed: $f" }
          }
          if (-not $app) { throw 'the app was not installed' }
          if ((Rule-Count) -ne 0) { throw 'a silent install added a firewall rule' }
          # The hook's own add command, as the installer runs it after a yes.
          $line = Select-String -Path app/src-tauri/windows/hooks.nsh -Pattern 'firewall add rule' | Select-Object -First 1
          $cmd = ($line.Line -replace '^.*advfirewall', 'advfirewall' -replace "'\s*$", '')
          $cmd = $cmd -replace '\$\{PCTWIN_FIREWALL_RULE\}', $rule -replace '\$INSTDIR\\\$\{MAINBINARYNAME\}\.exe', $app.FullName
          cmd /c "netsh $cmd"
          if ($LASTEXITCODE -ne 0) { throw "netsh $cmd failed" }
          $r = Get-NetFirewallRule -DisplayName $rule
          if (@($r).Count -ne 1) { throw 'expected exactly one rule' }
          if ($r.Direction -ne 'Inbound' -or $r.Action -ne 'Allow' -or "$($r.Profile)" -ne 'Private') { throw "wrong rule: $($r | Out-String)" }
          $port = $r | Get-NetFirewallPortFilter
          if ($port.Protocol -ne 'TCP') { throw "wrong protocol: $($port.Protocol)" }
          $prog = $r | Get-NetFirewallApplicationFilter
          if ($prog.Program -ne $app.FullName) { throw "wrong program: $($prog.Program)" }
          $u = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "the uninstaller ended with $($u.ExitCode)" }
          # The uninstaller copies itself away and finishes there: wait for the files to go.
          foreach ($n in 1..60) { if (-not (Test-Path (Join-Path $dir 'pctwin-helper.exe'))) { break }; Start-Sleep -Seconds 1 }
          if ((Rule-Count) -ne 0) { throw 'uninstalling left the firewall rule' }
          if (Test-Path (Join-Path $dir 'pctwin-helper.exe')) { throw 'uninstalling left the helper' }
      # The Mac app as built must carry the Local Network keys (src-tauri/Info.plist, merged by
      # `tauri build`). Per Apple TN3179 (developer.apple.com/documentation/technotes/
      # tn3179-understanding-local-network-privacy), without them the system's question may lack
      # PCTwin's reason and browsing for an unlisted Bonjour service can fail.
      - name: The Mac app declares the local network
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist="$(ls -d target/release/bundle/macos/*.app)/Contents/Info.plist"
          why="$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$plist")"
          echo "why: $why"
          [ -n "$why" ]
          services="$(plutil -extract NSBonjourServices json -o - "$plist")"
          echo "services: $services"
          [ "$services" = '["_pctwin._tcp","_pctwin-check._tcp"]' ]
          # Tauri's own keys are still there.
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = com.creoleailabs.pctwin ]
      # Phase 0 exit gate, "the blank app opens": the built app starts, its window loads the
      # screens, and it quits by itself (PCTWIN_SMOKE_TEST); a crash or a hang fails here.
      - name: The app opens
        shell: bash
        run: |
          for b in target/release/pctwin-app target/release/pctwin-app.exe target/release/PCTwin target/release/PCTwin.exe; do
            [ -x "$b" ] && app="$b" && break
          done
          echo "app: $app"
          marker="$RUNNER_TEMP/opened.txt"
          rm -f "$marker"
          export PCTWIN_SMOKE_TEST="$marker"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$app" & else "$app" & fi
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "the app did not quit within two minutes" >&2
            exit 1
          fi
          wait "$pid"
          cat "$marker"
          grep -q "titled PCTwin" "$marker"
      # The permission sweep (tests/permissions.rs) again as the app ships: a release build (Tauri
      # refuses and stores permissions differently without debug checks) with the app's own
      # protocol, as `tauri build` makes it. Once per system, so each overlay is included.
      - name: Permission sweep, release build
        if: contains(fromJSON('["windows-latest", "macos-latest", "ubuntu-latest"]'), matrix.os)
        run: cargo test -p pctwin-app --release --locked --features tauri/custom-protocol --test permissions
      - name: Keep the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pctwin-unsigned-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      # macOS only: two probes that REPORT facts about the platform. They never fail the job.
      - name: macOS probe, file leases (F_SETLEASE)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/lease_probe" fixtures/macos/lease_probe.c
          "$RUNNER_TEMP/lease_probe" "$RUNNER_TEMP" || true
      - name: macOS probe, inode number reuse on APFS (2000 files)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/inode_reuse" fixtures/macos/inode_reuse.c
          "$RUNNER_TEMP/inode_reuse" "$RUNNER_TEMP" || true
          df -T "$RUNNER_TEMP" 2>/dev/null || mount | head -3

  # Task List 0.7: a whole move between two user accounts on one machine, through the real engine
  # (pairing, sealed link, safety gate, journal). Hosted runners cannot pair with each other, so
  # live pairing between machines is tested on owned hardware; this proves everything else.
  two-accounts:
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    name: Test lab, move between two accounts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Everyone in one move sweeps the whole runner several times (the mover, each approved
    # person through the helper, and again with no administrator).
    # Two whole-disk sweeps of a Mac runner (with and without an administrator) take most of an hour.
    timeout-minutes: 120
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. On Linux as EGRESS_POLICY says; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && env.EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the lab tools
        run: cargo build --locked -p pctwin-lab -p pctwin-labmove
      # The administrator helper's system calls with a real second account, and the real prompt
      # where it cannot ask anyone: Windows (UAC prompts are off on the runners) makes a
      # throwaway account and checks the helper's pipe refuses it; Linux and macOS check a
      # socket in a private folder refuses `nobody`; Linux runs pkexec with no polkit agent;
      # macOS reads Service Management's state (registering needs a Developer ID signature).
      # pkexec is not on the Linux runner by default; without it the real prompt test has
      # nothing to run.
      - name: pkexec for the helper's prompt test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y pkexec
      - name: Helper system calls with a second account (pctwin-helper-os)
        env:
          PCTWIN_HELPER_OS_ADMIN_TESTS: "1"
        run: cargo test --locked -p pctwin-helper-os -- --ignored --nocapture --test-threads=1
      # Wi-Fi with its password through the real NetworkManager, the password only on nmcli's
      # standard input and output (2.4 follow-up). It manages no device here, so the runner's
      # own network is left alone; the test runs as root, which NetworkManager's check allows.
      - name: Wi-Fi through the real NetworkManager (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y network-manager jq
          printf '%s\n' '[main]' 'plugins=keyfile' '[keyfile]' 'unmanaged-devices=*' | sudo tee /etc/NetworkManager/conf.d/99-pctwin-lab.conf
          sudo systemctl restart NetworkManager
          bin=$(cargo test --locked -p pctwin-settings --test wifi_nm --no-run --message-format=json | jq -r 'select(.executable != null) | .executable')
          sudo env PCTWIN_NM_REAL=1 "$bin" --ignored --exact the_real_network_manager_keeps_a_password_given_only_on_standard_input --nocapture
      - name: Move between two accounts (Linux and macOS)
        if: runner.os != 'Windows'
        # /tmp, not the runner's temp folder: that sits in the runner's home, which the two test
        # accounts cannot enter.
        run: bash fixtures/two-accounts/run.sh "$PWD/target/debug" /tmp/pctwin-two-accounts
      - name: Move between two accounts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fixtures/two-accounts/run.ps1 -Bin "$PWD\target\debug" -Work 'C:\pctwin-two-accounts'
      # Phase 1's gate for moving everyone (Engineering Plan 5.1): several people in one move and
      # nothing forgotten, with real accounts, the real helper and a hostile mover. The script is
      # the administrator and answers the system's prompt from outside the product.
      - name: Build the helper for everyone in one move
        # Two builds: a --bin narrows a build to that program alone.
        run: |
          cargo build --locked -p pctwin-helper -p pctwin-labmove
          cargo build --locked -p pctwin-move --bin pctwin-handover
          cargo build --locked -p pctwin-parse --bin pctwin-parser
      - name: Everyone in one move (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash fixtures/everyone/run.sh "$PWD/target/debug" /tmp/pctwin-everyone
      - name: Everyone in one move (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fixtures/everyone/run.ps1 -Bin "$PWD\target\debug" -Work 'C:\pctwin-everyone'
      # The evidence sits outside the workspace (the test accounts cannot enter the runner's
      # folders), so it is copied in before it is kept.
      - name: Gather the evidence
        if: always()
        shell: bash
        run: |
          mkdir -p lab-evidence
          for d in /tmp/pctwin-everyone/admin /c/pctwin-everyone/admin; do
            if [ -d "$d" ]; then
              cp -r "$d" lab-evidence/everyone 2>/dev/null || sudo cp -r "$d" lab-evidence/everyone || true
            fi
          done
          for base in /tmp/pctwin-two-accounts /c/pctwin-two-accounts; do
          for d in "$base/report" "$base/profile/report" "$base/bad/report"; do
            if [ -d "$d" ]; then
              name=$(echo "$d" | sed 's#.*/pctwin-two-accounts/##; s#/#-#g')
              cp -r "$d" "lab-evidence/$name" 2>/dev/null || sudo cp -r "$d" "lab-evidence/$name" || true
            fi
          done
          done
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: two-accounts-${{ matrix.os }}
          path: lab-evidence
          if-no-files-found: warn
          retention-days: 14

  # Task List 0.7: cross-system handoff. One job scans a synthetic laptop and saves a lab package
  # (its record and each file under its item ID); a job on another system moves that package
  # through the real engine, so names born on one system meet the other system's safety gate.
  # The lab package is not encrypted: the encrypted drive package is Release 2's archive format.
  lab-pack:
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    name: Test lab, pack on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. On Linux as EGRESS_POLICY says; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && env.EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Make a lab laptop and pack it
        shell: bash
        run: |
          cargo build --locked -p pctwin-lab -p pctwin-labmove
          ./target/debug/pctwin-lab make "$RUNNER_TEMP/laptop" 41 60 1048576 > "$RUNNER_TEMP/made.json"
          ./target/debug/pctwin-labmove pack "$RUNNER_TEMP/laptop" lab-person lab-package
          cp "$RUNNER_TEMP/made.json" lab-package/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-package-${{ matrix.os }}
          path: lab-package
          if-no-files-found: error
          retention-days: 3

  lab-handoff:
    name: Test lab, move a package from ${{ matrix.from }} on ${{ matrix.to }}
    needs: [changes, lab-pack]
    if: needs.changes.outputs.labs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: windows-latest, to: macos-latest }
          - { from: macos-latest, to: windows-latest }
          - { from: windows-latest, to: ubuntu-latest }
          - { from: ubuntu-latest, to: windows-latest }
          # Mac and Linux both ways (Phase 2 exit gate: every supported direction).
          - { from: macos-latest, to: ubuntu-latest }
          - { from: ubuntu-latest, to: macos-latest }
    runs-on: ${{ matrix.to }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. On Linux as EGRESS_POLICY says; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && env.EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-package-${{ matrix.from }}
          path: lab-package
      - name: Move the package through the engine and check it
        shell: bash
        run: |
          cargo build --locked -p pctwin-lab -p pctwin-labmove
          bin=./target/debug
          echo "package made on: $(cat lab-package/origin.txt)"
          mkdir -p handoff evidence
          "$bin/pctwin-labmove" receive handoff evidence/received.json "$RUNNER_TEMP/journal.redb" \
            --lab "$RUNNER_TEMP/new" lab-person-new &
          receiver=$!
          "$bin/pctwin-labmove" send handoff evidence/sent.json --package lab-package
          wait "$receiver"
          "$bin/pctwin-lab" snapshot "$RUNNER_TEMP/new" evidence/dest.json
          "$bin/pctwin-labmove" check lab-package/before.json lab-package/before.json \
            evidence/dest.json evidence/sent.json evidence/received.json | tee evidence/check.txt
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-handoff-${{ matrix.from }}-to-${{ matrix.to }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14

  # Task List 2.5, Apple Mail (design of 30 October 2026): a macOS runner is the old
  # Mac, with a synthetic ~/Library/Mail/V10 (mailboxes On My Mac, a POP account, an IMAP
  # account, an account removed from Mail, the index with rows in its log); it captures the mail
  # as the old laptop does and checks its own mail is byte for byte unchanged. Windows and Linux
  # runners are the new laptop: the stream is read into staging, the mail kept only on the Mac
  # is written as mbox files through the real parser process and the safety gate, the IMAP
  # account ends as a sign-in line, and the staging folder is gone
  # (crates/pctwin-fullmove/examples/mail_lab.rs).
