  # Task List 1.8, decided 20 October 2026: two machines over a network. Two separate network
  # stacks on one runner (network namespaces), a virtual cable with poor-Wi-Fi conditions between
  # them, a lab laptop paired and moved across, and the cable cut for 8 seconds part way through
  # (fixtures/two-machines/run.sh says what this does not cover).
  lab-two-machines:
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    name: Test lab, two machines over a poor network
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the lab tools
        run: cargo build --locked -p pctwin-lab -p pctwin-labmove
      - name: Two machines, a poor cable and a drop
        run: bash fixtures/two-machines/run.sh "$PWD/target/debug" "$RUNNER_TEMP/two-machines"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-two-machines
          path: ${{ runner.temp }}/two-machines/evidence
          if-no-files-found: warn
          retention-days: 14

  # The dependency, workflow and code-scanning checks (security.yml), with CodeQL for the
  # languages the change touches.
  admin-e2e:
    # The join of Phase 2.2 and 2.3, end to end as an administrator (GitHub's Windows runners run
    # elevated): a tiny Windows Installer package built with Windows' own tools is installed
    # through the broker with its intent in the helper's journal first; the helper stops before
    # the outcome; the next helper finds the intent, checks Windows' list and does not install
    # again; a restore point is asked for and its answer recorded. Only that one test runs.
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    name: Admin end to end (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the test
        shell: bash
        run: cargo test -p pctwin-helper --test admin_e2e --locked --no-run
      - name: Install, stop, recover, never twice; a restore point
        timeout-minutes: 15
        shell: bash
        run: >-
          cargo test -p pctwin-helper --test admin_e2e --locked --
          --ignored --exact an_elevated_install_stopped_before_its_outcome_is_never_done_twice
          --nocapture

  admin-winget:
    # Phase 2.1, end to end as an administrator: a real signed Windows Installer package is
    # downloaded with winget as the runner's account, matched to the app by its product code,
    # kept in the helper's own folder, checked by the helper's own maker check, installed by the
    # helper's real adapter, found again by its exact bytes in Windows' own list (so a crash never
    # installs it twice), given its result word, and removed. Only that one test runs.
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    name: Admin winget install (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the test
        shell: bash
        run: cargo test -p pctwin-apps --test admin_winget --locked --no-run
      - name: Download, check, install, find by its bytes, remove
        timeout-minutes: 20
        shell: bash
        run: >-
          cargo test -p pctwin-apps --test admin_winget --locked --
          --ignored --exact a_winget_download_is_installed_by_the_helper_and_found_by_its_exact_bytes
          --nocapture

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    with:
      codeql: ${{ needs.changes.outputs.codeql }}

  # The one check main requires, under the same name for pull requests and the merge queue. It
  # passes when every job the change needed passed (a job not needed is skipped, which is fine)
  # and fails if any failed or was cancelled, or if the decision itself did not run.
  all-checks:
    name: All checks
    if: always()
    needs:
      - changes
      - ui
      - motion
      - fuzz
      - real-drives
      - rust-quick
      - rust
      - two-accounts
      - lab-pack
      - lab-handoff
      - mail-lab-send
      - mail-lab-receive
      - lab-two-machines
      - admin-e2e
      - admin-winget
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          DECIDED: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          echo "heavy set: $HEAVY"
          echo "results: $RESULTS"
          if [ "$DECIDED" != success ]; then
            echo "the decision of what to run did not finish ($DECIDED)" >&2
            exit 1
          fi
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "a needed job failed or was cancelled" >&2
            exit 1
          fi
