        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - name: Toolchain, second try (a download that failed)
        if: steps.toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The old Mac sends its mail
        shell: bash
        run: |
          cargo build --locked -p pctwin-parse --bin pctwin-parser
          cargo run --locked -p pctwin-fullmove --example mail_lab -- send mail-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mail-package
          path: mail-package
          if-no-files-found: error
          retention-days: 3

