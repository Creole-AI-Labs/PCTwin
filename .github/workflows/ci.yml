name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Screens (type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # A stuck runner (an apt mirror once hung for over an hour) is stopped instead of waiting
    # for GitHub's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Bounded network waits and retries: a slow package mirror hung this step twice.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The app's Rust build embeds the built screens, so build them first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build screens
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unsafe fence (only pctwin-lease may loosen unsafe_code)
        shell: bash
        run: bash scripts/unsafe-fence.sh
      - name: Fence canary (clippy must reject a file removal in the canary crate)
        shell: bash
        run: bash scripts/clippy-canary.sh
      # The gate, journal and transfer tests all run here, on macOS too (the matrix includes
      # macos-latest and macos-15-intel): this runs the whole workspace.
      - name: Tests
        run: cargo test --workspace --locked
      # macOS only: two probes that REPORT facts about the platform. They never fail the job.
      - name: macOS probe, file leases (F_SETLEASE)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/lease_probe" fixtures/macos/lease_probe.c
          "$RUNNER_TEMP/lease_probe" "$RUNNER_TEMP" || true
      - name: macOS probe, inode number reuse on APFS (2000 files)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cc -o "$RUNNER_TEMP/inode_reuse" fixtures/macos/inode_reuse.c
          "$RUNNER_TEMP/inode_reuse" "$RUNNER_TEMP" || true
          df -T "$RUNNER_TEMP" 2>/dev/null || mount | head -3
