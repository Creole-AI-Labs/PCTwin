name: Security

# Called by CI (ci.yml) for pull requests, the merge queue and pushes to main, so its results
# count in "All checks"; it also runs weekly on its own, and by hand.
on:
  workflow_call:
    inputs:
      codeql:
        description: The languages CodeQL scans, as a JSON list (an empty list scans none).
        type: string
        default: '["rust","javascript-typescript","actions"]'
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC, to catch newly published advisories
  workflow_dispatch:

permissions:
  contents: read

env:
  # The network guard (Harden-Runner) only watches in this workflow's jobs, which read and hold
  # no secrets: its agent drops allowed sites' other addresses on some runners, failing
  # checkouts at random (step-security/harden-runner#708; decided 25 October 2026). Set back to
  # block when that issue is closed. Jobs that sign or publish keep block.
  EGRESS_POLICY: audit

jobs:
  cargo-deny:
    name: Rust dependencies (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: "1.99.0"
      # The fuzz targets are their own workspace with their own lockfile: the same rules
      # (deny.toml is found from there).
      - name: The same for the fuzz workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --all-features
          rust-version: "1.99.0"

  cargo-vet:
    name: Rust supply-chain audits (cargo-vet)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-vet@0.10.2
      # Every crate must be audited (ours or an imported audit from Mozilla, Google, Bytecode
      # Alliance, ISRG or Zcash) or listed as an exemption; a new crate fails until it is either.
      - run: cargo vet --locked

  osv-scanner:
    name: Known vulnerabilities (OSV, Rust and npm lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=fuzz/Cargo.lock
            --lockfile=app/pnpm-lock.yaml

  zizmor:
    name: Workflow safety (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        run: pipx run zizmor==1.30.1 --format plain .github/workflows

  codeql:
    name: Code scanning (CodeQL, ${{ matrix.language }})
    # Code scanning is free on public repositories; this job switches on when the repo goes public.
    if: github.event.repository.private == false && inputs.codeql != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql || '["rust","javascript-typescript","actions"]') }}
    steps:
      # Watches only, like the jobs above: its one write is code scanning results, and blocking
      # failed both merge-queue runs of PR 103 on #708 (decided 26 October 2026).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
