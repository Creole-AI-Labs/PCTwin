name: Release

# A version tag (v1.2.3) builds the app on every system, writes the bill of materials (SBOM) and
# the third-party licence notices, signs a provenance statement for every file with GitHub's
# attestations, and opens a draft release with all of it. Run by hand, it does the same without
# the release, to check the pipeline. Code signing (Certum, Apple) is added when the certificates
# exist; until then the apps are unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # No build caches in a release: every file is built from the tagged source alone.
      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS) bundles=app ;;
            Linux) bundles=deb ;;
          esac
          pnpm tauri build --ci --bundles "$bundles"
      - name: Collect the files
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          mkdir -p out
          bundle=target/release/bundle
          case "$RUNNER_OS" in
            Windows) cp "$bundle"/nsis/*.exe "out/PCTwin-setup-$OS.exe" ;;
            macOS) tar -C "$bundle/macos" -czf "out/PCTwin-$OS.app.tar.gz" PCTwin.app ;;
            Linux) cp "$bundle"/deb/*.deb "out/PCTwin-$OS.deb" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  notices:
    name: Bill of materials and licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Write the SBOM and the notices
        run: bash scripts/release-notices.sh out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices
          path: out/*
          if-no-files-found: error

  publish:
    name: Attest and draft the release
    needs: [build, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release (tags only)
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: The SBOM, tied to every app file
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/PCTwin-*
          sbom-path: dist/pctwin.cdx.json
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
            --title "PCTwin $TAG" \
            --notes "Unsigned build. Check a file came from this repository with: gh attestation verify <file> --repo $REPO"
