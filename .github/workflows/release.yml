name: Release

# A version tag (v1.2.3) builds the app on every system, writes the bill of materials (SBOM) and
# the third-party licence notices, signs a provenance statement for every file with GitHub's
# attestations, and opens a draft release with all of it. Run by hand, it does the same without
# the release, to check the pipeline. Code signing (Certum, Apple) is added when the certificates
# exist; until then the apps are unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          # The guard's start-up step runs on every system whatever the `if` says, and on
          # Windows a blocking policy also blocks the certificate revocation check, so the
          # toolchain download fails. Block on Linux; elsewhere only watch.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # No build caches in a release: every file is built from the tagged source alone.
      # The version: a tag's own (v1.2.3 is 1.2.3); a run by hand is 0.1.<run number>, so each
      # test build is newer than the last and installed copies offer it as an update.
      - name: Version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="0.1.$RUN"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $version"
      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          case "$RUNNER_OS" in
            Windows) bundles=nsis; os=windows ;;
            macOS) bundles=app; os=macos ;;
            Linux) bundles=deb; os=linux ;;
          esac
          # This system's settings and the version, as one config for the build.
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));c.version=process.argv[2];fs.writeFileSync("build.json",JSON.stringify(c))' "src-tauri/bundle/$os.json" "$VERSION"
          pnpm tauri build --ci --bundles "$bundles" --config build.json
      - name: Collect the files
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          mkdir -p out
          bundle=target/release/bundle
          case "$RUNNER_OS" in
            Windows) cp "$bundle"/nsis/*.exe "out/PCTwin-setup-$OS.exe" ;;
            macOS) tar -C "$bundle/macos" -czf "out/PCTwin-$OS.app.tar.gz" PCTwin.app ;;
            Linux) cp "$bundle"/deb/*.deb "out/PCTwin-$OS.deb" ;;
          esac
          echo "$VERSION" > out/version.txt
          ls -l out
      # Updates (app/src-tauri/src/updates.rs): the Windows installer and the Mac app archive are
      # signed with the update key, which installed copies check before installing. The key
      # reaches this step only, which runs Tauri's own signer and nothing from the build. Linux
      # packages (.deb) are not updated this way. Without the key (a fork), nothing is signed.
      - name: Sign for updates
        if: runner.os != 'Linux'
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "No update key: not signed for updates"; exit 0; fi
          for f in ../out/*.exe ../out/*.app.tar.gz; do
            [ -e "$f" ] || continue
            # Bound to this version, so an older signed build is never accepted as a newer one.
            pnpm tauri signer sign --app-version "$VERSION" "$f"
          done
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  notices:
    name: Bill of materials and licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the network guard's start-up step runs even though the guard itself is
      # Linux-only, and for a few seconds it leaves the runner with no DNS: the toolchain
      # download then failed. Wait (bounded) until names resolve.
      - name: Wait for DNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          for ($i = 1; $i -le 60; $i++) {
            try { Resolve-DnsName static.rust-lang.org -ErrorAction Stop | Out-Null; Write-Host "DNS ready after $i tries"; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          Write-Error "DNS did not come back within two minutes"
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Write the SBOM and the notices
        run: bash scripts/release-notices.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: out/*
          if-no-files-found: error

  publish:
    name: Attest and draft the release
    needs: [build, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release (tags only)
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ports.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: The SBOM, tied to every app file
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/PCTwin-*
          sbom-path: dist/pctwin.cdx.json
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
            --title "PCTwin $TAG" \
            --notes "Unsigned build. Check a file came from this repository with: gh attestation verify <file> --repo $REPO"
