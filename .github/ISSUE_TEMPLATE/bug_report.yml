name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't include passwords, keys or private files. Report security problems privately (see SECURITY.md)."
  - type: input
    id: version
    attributes:
      label: PCTwin version
    validations:
      required: true
  - type: input
    id: old
    attributes:
      label: Old laptop (system and version)
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: input
    id: new
    attributes:
      label: New laptop (system and version)
      placeholder: "macOS 26, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
